services:
  - type: web
    name: mindtrack-nlp-service
    env: python
    buildCommand: "pip install -r 02_project_setup_and_architecture/requirements.txt && python 03_dataset_collection_and_exploration/download_datasets.py && python 04_preprocessing_and_nlp_training/train.py"
    startCommand: "python 05_backend_api_and_inference/api_server.py"
    envVars:
      - key: PORT
        value: 8000
